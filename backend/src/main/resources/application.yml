server:
  port: 8080

spring:
  application:
    name: volunteer-service
  datasource:
    url: jdbc:mysql://localhost:3306/volunteer_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

security:
  jwt:
    secret: "volunteer-service-system-secret-key-please-change-in-production-2026"
    expire-hours: 12

logging:
  level:
    org.springframework.security: WARN
    com.volunteer: INFO
